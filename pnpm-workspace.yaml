packages:
  - "backend"
  - "react-app"
  - "packages/*"

# pnpm blocks dependency build/lifecycle scripts by default (a security measure).
# Decide per package which trusted scripts may run:
#   - protobufjs: used by firebase-admin (gRPC/protobuf) on the backend -> allow.
#   - esbuild: installs its native binary; required by tsx/vitest -> allow.
#   - core-js / core-js-pure: postinstall only prints a funding notice and comes from
#     the CRA toolchain removed in Phase 6 -> keep blocked.
#   - mongodb-memory-server: its postinstall pre-downloads the mongod binary. Keep it
#     blocked so `pnpm install` stays offline; the binary downloads lazily on the
#     first test run instead.
#   - @firebase/util: pure-JS utility pulled in by firebase-admin; its lifecycle
#     script is not needed at runtime -> keep blocked.
allowBuilds:
  protobufjs: true
  esbuild: true
  core-js: false
  core-js-pure: false
  mongodb-memory-server: false
  "@firebase/util": false
